name: Claude Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
          prompt: |
            Analyze GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue title and body carefully.

            2. Apply the best-matching label(s) to the issue using
               `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
               Only choose from this existing, fixed label set — do not create new labels:
               bug, documentation, duplicate, enhancement, good first issue, help wanted,
               invalid, question, wontfix.
               If this issue was edited and a previously-applied label from this set no
               longer fits, remove it with
               `gh issue edit ${{ github.event.issue.number }} --remove-label "<label>"`.

            3. Investigate the repository code (index.html, style.css, game.js) as needed
               to ground your analysis in the actual implementation described in CLAUDE.md
               (board/collision model, rotation/wall-kick, game loop, scoring/level/speed
               coupling, rendering).

            4. Post exactly one diagnostic comment on the issue via
               `gh issue comment ${{ github.event.issue.number }} --body "..."` containing:
               - A concise restatement of the problem
               - The likely root cause
               - The specific file(s)/function(s) involved (e.g. `collide`, `rotateCW`,
                 `tryRotate`, `clearLines`, `lockPiece`, `loop`, `draw`)
               - Suggested next steps or a fix approach, at a high level

               Do not implement a fix, do not open a pull request, and do not modify any
               files in the repository — this is diagnosis only.
