name: Claude Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__update_issue,mcp__github__create_issue_comment,Read,Grep,Glob"
          prompt: |
            You are a GitHub issue triage assistant for a Tetris game project (vanilla JS/HTML/CSS,
            no dependencies). Analyze issue #${{ github.event.issue.number }} in
            ${{ github.repository }} (this run was triggered by: ${{ github.event.action }}).

            1. Use mcp__github__get_issue to fetch the issue's title, body, and current labels.

            2. Choose the best-matching label(s) from this fixed set only — do not invent new
               labels: bug, documentation, duplicate, enhancement, good first issue, help wanted,
               invalid, question, wontfix.
               Apply them with mcp__github__update_issue, passing the full desired label set for
               the issue (this call replaces all labels, so include any still-applicable existing
               labels from this set and omit ones that no longer fit — this is how edits/reopens
               should end up dropping stale labels).

            3. Use Read/Grep/Glob to inspect index.html, style.css, and game.js as needed to
               ground your diagnosis in the actual implementation described in CLAUDE.md
               (board/collision model, rotation/wall-kick, game loop, scoring/level/speed
               coupling, rendering) — e.g. `collide`, `rotateCW`/`tryRotate`, `clearLines`,
               `lockPiece`, the `loop`/`draw` render cycle.

            4. Post exactly one comment via mcp__github__create_issue_comment with:
               - A brief, friendly 1-2 sentence summary of what the issue is about
               - A "Diagnostic Report" section with:
                 - **Type**: Bug / Feature Request / Question / Other
                 - **Summary**: one clear sentence describing the problem or request
                 - **Likely root cause**: grounded in the actual code (file(s)/function(s)
                   involved), or "N/A" if not applicable (e.g. a question or feature request)
                 - **Steps to reproduce** (for bugs): list them if provided; otherwise ask the
                   reporter to provide them
                 - **Expected behavior** (for bugs): what should happen instead
                 - **Suggested next steps**: a high-level fix approach, not an implementation
                 - **Labels applied**: the labels you applied and why
               - A closing note thanking the contributor

               Be concise, helpful, and friendly. Do not over-engineer the response.
               Do not implement a fix, do not open a pull request, and do not modify any
               files in the repository — this is diagnosis only.
