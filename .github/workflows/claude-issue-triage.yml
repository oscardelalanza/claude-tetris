name: Claude Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__update_issue,mcp__github__create_issue_comment,Read,Grep,Glob"
          prompt: |
            Analyze GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Use mcp__github__get_issue to fetch the issue's title, body, and current labels.

            2. Choose the best-matching label(s) from this fixed set only — do not invent new
               labels: bug, documentation, duplicate, enhancement, good first issue, help wanted,
               invalid, question, wontfix.
               Apply them with mcp__github__update_issue, passing the full desired label set for
               the issue (this call replaces all labels, so include any still-applicable existing
               labels from this set and omit ones that no longer fit — this is how edits/reopens
               should end up dropping stale labels).

            3. Use Read/Grep/Glob to inspect index.html, style.css, and game.js as needed to
               ground your analysis in the actual implementation described in CLAUDE.md
               (board/collision model, rotation/wall-kick, game loop, scoring/level/speed
               coupling, rendering).

            4. Post exactly one diagnostic comment via mcp__github__create_issue_comment
               containing:
               - A concise restatement of the problem
               - The likely root cause
               - The specific file(s)/function(s) involved (e.g. `collide`, `rotateCW`,
                 `tryRotate`, `clearLines`, `lockPiece`, `loop`, `draw`)
               - Suggested next steps or a fix approach, at a high level

               Do not implement a fix, do not open a pull request, and do not modify any
               files in the repository — this is diagnosis only.
