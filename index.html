<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema claro/oscuro">🌙</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="highscores-widget" class="highscores-widget">
      <h2 class="highscore-heading">Mejores Puntuaciones</h2>
      <ol id="highscores-list" class="highscore-list"></ol>
      <button id="reset-scores-btn" class="btn-secondary btn-block">Reiniciar puntuaciones</button>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <div id="highscore-entry" class="hidden">
          <label for="player-name-input">Nombre:</label>
          <input id="player-name-input" maxlength="10" placeholder="AAA" />
          <button id="save-score-btn" class="btn-secondary">Guardar</button>
        </div>
        <div id="overlay-highscores">
          <h3 class="highscore-heading highscore-heading-sm">Mejores Puntuaciones</h3>
          <ol id="overlay-highscores-list" class="highscore-list"></ol>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
